# XcodeGen spec — this file IS the project. `pnpm generate` writes the .xcodeproj (gitignored).
# Reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: SmokeSwift
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: '15.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    # From the environment (direnv). Empty → unsigned build, which is what CI runs.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

packages:
  SmokeSwiftCore:
    path: ../../packages/core

targets:
  SmokeSwift:
    type: application
    platform: macOS # → `supportedDestinations: [macOS, iOS]` for a multiplatform target
    sources: [Sources]
    dependencies:
      - package: SmokeSwiftCore
    entitlements:
      path: SmokeSwift.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Info.plist
      properties:
        CFBundleName: SmokeSwift
        CFBundleDisplayName: 'Smoke Swift'
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smoke-swift
        ENABLE_HARDENED_RUNTIME: true
    scheme: {}

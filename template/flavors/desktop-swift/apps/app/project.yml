# XcodeGen spec — this file IS the project. `pnpm generate` writes the .xcodeproj (gitignored).
# Reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: {{PROJECT_PASCAL}}
options:
  bundleIdPrefix: {{BUNDLE_ID_PREFIX}}
  deploymentTarget:
    macOS: '15.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    # From the environment (direnv). Empty → unsigned build, which is what CI runs.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

packages:
  {{PROJECT_PASCAL}}Core:
    path: ../../packages/core

targets:
  {{PROJECT_PASCAL}}:
    type: application
    platform: macOS # → `supportedDestinations: [macOS, iOS]` for a multiplatform target
    sources: [Sources]
    dependencies:
      - package: {{PROJECT_PASCAL}}Core
    entitlements:
      path: {{PROJECT_PASCAL}}.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Info.plist
      properties:
        CFBundleName: {{PROJECT_PASCAL}}
        CFBundleDisplayName: {{PROJECT_PASCAL}}
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        ENABLE_HARDENED_RUNTIME: true
    scheme: {}

pre-commit:
  parallel: true
  commands:
    swift-format:
      glob: '*.swift'
      run: xcrun swift-format format -i {staged_files}
      stage_fixed: true
    format:
      glob: '*.{js,mjs,json,md,yml,yaml}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: pnpm verify

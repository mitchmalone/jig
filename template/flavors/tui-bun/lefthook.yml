pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: '*.{ts,tsx,js,mjs,json,md,css,yml,yaml}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: bun run verify
